[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdocs-doctor"
version = "0.1.0"
description = "Check AGENTS.md, CLAUDE.md, Cursor rules, and agent skills for stale paths, missing commands, and conflicts."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Karl Perron"}]
keywords = ["ai", "agents", "skills", "docs", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/perron/agentdocs-doctor"
Repository = "https://github.com/perron/agentdocs-doctor"
Issues = "https://github.com/perron/agentdocs-doctor/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentdocs-doctor = "agentdocs_doctor.cli:main"

[tool.setuptools.packages.find]
include = ["agentdocs_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
